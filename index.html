<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="displayNumbers"></h1>
    <p>
        <button onclick="
            updateCalculation(1)
            "
        >
            1
        </button>

        <button onclick="
            updateCalculation(2)
            "
        >
            
            2
        </button>

        <button onclick="
            updateCalculation(3)
            "
        >
            3
        </button>

        <button class="operator" onclick="
            updateCalculation(' + ')
            "
        >
            
            +
        </button>
    </p>

    <p>
        <button onclick="
            updateCalculation(4)
            "
        >
            
            4
        </button>

        <button onclick="
            updateCalculation(5)
            "
        >
            
            5
        </button>

        <button onclick="
            updateCalculation(6)
            "
        >
            
            6
        </button>

        <button class="operator" onclick="
            updateCalculation(' - ')
            "
        >
            
            -
        </button>
    </p>

    <p>
        <button onclick="
            updateCalculation(7)
            "
        >
            
            7
        </button>

        <button onclick="
            updateCalculation(8)
            "
        >
            
            8
        </button>

        <button onclick="
            updateCalculation(9)
            "
        >
            
            9
        </button>

        <button class="operator" onclick="
            updateCalculation(' * ')
            "
        >
            
            *
        </button>
    </p>

    <p>
        <button onclick="
            updateCalculation(0)
            "
        >
            
            0
        </button>

        <button onclick="
            updateCalculation('.')
            "
        >
            
            .
        </button>

        <button onclick="
            calculateResult()
            "
        >
            
            =
        </button>

        <button class="operator" onclick="
            updateCalculation(' / ')
            "
        >
            
            /
        </button>
    </p>

    <p>
        <button class="clear" onclick="
            clearCalculation()
            localStorage.removeItem('calculationResult');
            "
        >
            
            Clear
        </button>

        <button class="clear" onclick="
            deleteLast()
            "
        >
            
            Del
        </button>
    </p>

    
    <script src="script.js"></script>
</body>
</html>
